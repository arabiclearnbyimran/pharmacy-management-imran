    input {

    input:focus {

    button {

      padding: 14px 22px;

    .show-all-button {

      line-height: 1.7;
    }

    .count {
      background: white;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .empty,
    .no-result {
      background: white;
      border-radius: 14px;
      padding: 25px;
      text-align: center;
      color: #667085;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 15px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.07);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 23px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 13px;
      background: #fafafa;
    }

    .full {
      grid-column: 1 / -1;
    }

    .label {
      display: block;
      font-size: 13px;
      color: #667085;
      margin-bottom: 5px;
    }

    .value {
      font-weight: 600;
      font-size: 16px;
      white-space: pre-line;
    }

    .price,
    .stock,
    .rack {
      font-size: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #667085;
      font-size: 13px;
    }

    @media (max-width: 650px) {

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      h1 {
        font-size: 25px;
      }

    }

  </style>

</head>

<script>

/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   DISPLAY MEDICINES
   ===================================================== */

function displayMedicines(list) {

  const results = document.getElementById("results");


  // Medicine count

  let html = `

    <div class="count">

      💊 Total Medicines Found:
      <strong>${list.length}</strong>

    </div>

  `;


  // যদি কোনো medicine না থাকে

  if (list.length === 0) {

    results.innerHTML = html + `

      <div class="no-result">

        ❌ No medicine found.

      </div>

    `;

    return;

  }


  // সব medicine দেখানো

  html += list.map(function(medicine) {

    return `

      <div class="card">

        <h2>
          💊 ${escapeHtml(medicine.brand || "Brand not added")}
        </h2>


        <div class="grid">


          <div class="item">

            <span class="label">
              Generic Name
            </span>

            <span class="value">
              ${escapeHtml(medicine.generic || "Not added")}
            </span>

          </div>


          <div class="item">

            <span class="label">
              Brand Name
            </span>

            <span class="value">
              ${escapeHtml(medicine.brand || "Not added")}
            </span>

          </div>


          <div class="item">

            <span class="label">
              Company
            </span>

            <span class="value">
              ${escapeHtml(medicine.company || "Not added")}
            </span>

          </div>


          <div class="item">

            <span class="label">
              Strength
            </span>

            <span class="value">
              ${escapeHtml(medicine.strength || "Not added")}
            </span>

          </div>


          <div class="item">

            <span class="label">
              Sale Price
            </span>

            <span class="value price">
              ${escapeHtml(medicine.price || "Not added")}
            </span>

          </div>


          <div class="item">

            <span class="label">
              Stock
            </span>

            <span class="value stock">
              ${escapeHtml(String(medicine.stock ?? "Not added"))}
            </span>

          </div>


          <div class="item">

            <span class="label">
              Rack / Location
            </span>

            <span class="value rack">
              📍 ${escapeHtml(medicine.rack || "Not added")}
            </span>

          </div>


          ${
            medicine.indications
            ?
            `

            <div class="item full">

              <span class="label">
                নির্দেশনা / Indications
              </span>

              <span class="value">
                ${escapeHtml(medicine.indications)}
              </span>

            </div>

            `
            :
            ""
          }


        </div>

      </div>

    `;

  }).join("");


  results.innerHTML = html;

}


/* =====================================================
   SEARCH MEDICINE
   ===================================================== */

function searchMedicine() {

  const input = document.getElementById("searchInput");

  const query = input.value.trim().toLowerCase();


  // খালি Search

  if (query === "") {

    document.getElementById("results").innerHTML = `

      <div class="empty">

        🔎 Please type a medicine, brand or company name.

      </div>

    `;

    return;

  }


  /* ===================================================
     ALL / SHOW / HOME
     =================================================== */

  if (
    query === "all" ||
    query === "show" ||
    query === "home"
  ) {

    displayMedicines(medicines);

    return;

  }


  /* ===================================================
     NORMAL SEARCH
     =================================================== */

  const matches = medicines.filter(function(medicine) {

    const generic =
      String(medicine.generic || "").toLowerCase();

    const brand =
      String(medicine.brand || "").toLowerCase();

    const company =
      String(medicine.company || "").toLowerCase();


    return (

      generic.includes(query) ||

      brand.includes(query) ||

      company.includes(query)

    );

  });


  displayMedicines(matches);

}


/* =====================================================
   SEARCH BUTTON
   ===================================================== */

document
  .getElementById("searchButton")
  .addEventListener("click", function() {

    searchMedicine();

  });


/* =====================================================
   SHOW ALL BUTTON
   ===================================================== */

document
  .getElementById("showAllButton")
  .addEventListener("click", function() {

    document.getElementById("searchInput").value = "all";

    displayMedicines(medicines);

  });


/* =====================================================
   ENTER KEY
   ===================================================== */

document
  .getElementById("searchInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      searchMedicine();

    }

  });


</script>
