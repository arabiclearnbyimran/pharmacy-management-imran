function escapeHtml(text) {
  return String(text ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function displayMedicines(list) {
  const results = document.getElementById("results");
  let html = `<div class="count">💊 Total Medicines Found: <strong>${list.length}</strong></div>`;

  if (!list.length) {
    results.innerHTML = html + `<div class="no-result">❌ No medicine found.</div>`;
    return;
  }

  html += list.map(m => `
    <div class="card">
      <h2>💊 ${escapeHtml(m.brand || "Brand not added")}</h2>
      <div class="grid">
        <div class="item">
          <span class="label">Generic Name</span>
          <span class="value">${escapeHtml(m.generic)}</span>
        </div>
        <div class="item">
          <span class="label">Brand Name</span>
          <span class="value">${escapeHtml(m.brand)}</span>
        </div>
        <div class="item">
          <span class="label">Company</span>
          <span class="value">${escapeHtml(m.company)}</span>
        </div>
        <div class="item full">
          <span class="label">Instruction / কোন রোগে ব্যবহার</span>
          <span class="value">${escapeHtml(m.instruction)}</span>
        </div>
      </div>
    </div>
  `).join("");

  results.innerHTML = html;
}

function setActive(button) {
  document.querySelectorAll(".category-button").forEach(b => b.classList.remove("active"));
  if (button) button.classList.add("active");
}

function searchMedicine() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!q) {
    displayMedicines([]);
    document.getElementById("results").innerHTML =
      `<div class="empty">🔎 Generic, Brand বা Company লিখে Search করুন।</div>`;
    return;
  }

  setActive(null);

  const matches = medicines.filter(m =>
    String(m.generic).toLowerCase().includes(q) ||
    String(m.brand).toLowerCase().includes(q) ||
    String(m.company).toLowerCase().includes(q) ||
    String(m.instruction).toLowerCase().includes(q)
  );

  displayMedicines(matches);
}

function showCategory(category, button) {
  document.getElementById("searchInput").value = "";
  setActive(button);
  const matches = medicines.filter(m => (m.categories || []).includes(category));
  displayMedicines(matches);
}

function buildCategoryButtons() {
  const box = document.getElementById("categoryButtons");
  box.innerHTML = "";

  categoryOrder.forEach(category => {
    const count = medicines.filter(m => (m.categories || []).includes(category)).length;
    if (!count) return;

    const b = document.createElement("button");
    b.type = "button";
    b.className = "category-button";
    b.innerHTML = `${category} <small>(${count})</small>`;
    b.addEventListener("click", () => showCategory(category, b));
    box.appendChild(b);
  });
}

function normalizeOCR(text) {
  return String(text || "").toLowerCase()
    .replace(/[^\p{L}\p{N}\s.-]/gu, " ")
    .replace(/\s+/g, " ").trim();
}

function levenshtein(a,b) {
  const dp = Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
  for(let i=0;i<=a.length;i++) dp[i][0]=i;
  for(let j=0;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,
      dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[a.length][b.length];
}

function medicineOCRScore(name, text) {
  const n=normalizeOCR(name), t=normalizeOCR(text);
  if(!n || n.length<3) return 0;
  if(t.includes(n)) return 1;

  const words=n.split(/\s+/).filter(w=>w.length>=3);
  let found=0;
  words.forEach(w=>{ if(t.includes(w)) found++; });
  if(words.length && found===words.length) return .95;
  if(words.length && found>0) return .65;

  const ocrWords=t.split(/\s+/).filter(w=>w.length>=3);
  let best=0;
  ocrWords.forEach(ow=>words.forEach(nw=>{
    const maxLen=Math.max(ow.length,nw.length);
    const sim=1-levenshtein(ow,nw)/maxLen;
    if(sim>best) best=sim;
  }));
  return best>=.78 ? best : 0;
}

function findMedicinesFromOCR(text) {
  return medicines.map(m=>({
    medicine:m,
    score:Math.max(
      medicineOCRScore(m.brand,text),
      medicineOCRScore(m.generic,text)
    )
  })).filter(x=>x.score>=.65)
    .sort((a,b)=>b.score-a.score)
    .map(x=>x.medicine);
}

prescriptionInput.addEventListener("change", async function() {
  const file=this.files && this.files[0];
  if(!file) return;

  cameraStatus.style.display="block";
  cameraStatus.textContent="📷 Prescription পড়া হচ্ছে... একটু অপেক্ষা করুন।";

  try {
    if(typeof Tesseract==="undefined") throw new Error("OCR library not loaded");

    const result=await Tesseract.recognize(file,"eng",{
      logger: info => {
        if(info.status==="recognizing text" && info.progress)
          cameraStatus.textContent="📷 Prescription পড়া হচ্ছে... "+
            Math.round(info.progress*100)+"%";
      }
    });

    const ocrText=result.data.text || "";
    const matches=findMedicinesFromOCR(ocrText);

    if(matches.length) {
      displayMedicines(matches);
      cameraStatus.textContent="✅ Prescription থেকে সম্ভাব্য medicine পাওয়া গেছে। OCR ভুল হলে Search দিয়ে যাচাই করুন।";
    } else {
      document.getElementById("results").innerHTML=`
        <div class="no-result">
          ❌ Database-এর কোনো medicine match পাওয়া যায়নি।<br><br>
          <small>OCR text:</small><br>
          <div style="margin-top:8px;text-align:left;white-space:pre-line">
            ${escapeHtml(ocrText || "কোনো লেখা পাওয়া যায়নি।")}
          </div>
        </div>`;
      cameraStatus.textContent="⚠️ পরিষ্কার ও সোজা prescription ছবি দিয়ে আবার চেষ্টা করুন।";
    }
  } catch(e) {
    console.error(e);
    cameraStatus.textContent="❌ Prescription পড়তে সমস্যা হয়েছে। Internet ও পরিষ্কার ছবি পরীক্ষা করুন।";
  }

  prescriptionInput.value="";
});
